# ── General Pipeline Input/Output ─────────────────────────────────────────────
pipeline:
  input_path: "data/sample_test_video.mp4"
  output_path: "outputs/highlight.mp4"

# ── Phase 1: Temporal Segmentation ───────────────────────────────────────────
segmentation:
  # Number of uniformly sampled frames extracted per micro-scene
  frames_per_scene: 16
  # Scene change detection algorithm: "content" | "adaptive" | "threshold"
  detector: "content"
  # ContentDetector / AdaptiveDetector threshold (higher = fewer scene cuts)
  threshold: 27.0

# ── Phase 2: Stream A — Semantic Relevance (Two-Stage Cascade OD) ────────────
streams:
  semantic:
    # ── Stage 1: Always-on lightweight detector ───────────────────────────────
    # Justified by Hua et al. (2025) [OD-1]: YOLOv8-S best speed-accuracy S-class.
    yolo_model: "yolov8s.pt"

    # ── Stage 2: Gated expensive detector (runs only on candidates) ───────────
    # Only triggered when Stage 1 top confidence >= stage2_trigger_threshold.
    # Implements cascade principle from Shah et al. (2026) [OD-3]:
    #   RR = (1 - alpha) * C_expensive / (C_cheap + C_expensive)  (~69.5% savings)
    yolo_model_heavy: "yolov9e.pt"
    stage2_trigger_threshold: 0.60

    # ── YOLO-World (zero-shot prompts only) ───────────────────────────────────
    yolo_world_model: "yolov8s-world.pt"
    prompt: []

    # ── Detection threshold ───────────────────────────────────────────────────
    min_confidence: 0.25

    # ── Kalman Tracker (adaptive tau -- fixes Shah et al. fixed tau=75 limitation)
    video_fps: 25.0
    tau_base_sec: 5.0

    # ── FLOP budgets (for cascade savings reporting, Hua et al. [OD-1]) ───────
    stage1_gflops: 28.6
    stage2_gflops: 189.0

  # ── Phase 3: Stream B — Affective Scoring (FER + Explainability) ────────────
  affective:
    # Emotion backend: "fer_cnn" | "stub"
    backend: "fer_cnn"
    # Backbone architecture:
    #   "clcm_attention" — RECOMMENDED: MobileNetV2 + Spatial Attention + Regularized Head
    #   "clcm"           — PyTorch CLCM (~2.4M params, Gursesli et al., 2024)
    #   "mini_xception"  — PyTorch Mini-Xception (~58K params)
    backbone: "clcm_attention"

    # Trained Keras model and weights from curriculum learning
    keras_model: "weights/final_model.keras"
    keras_weights: "weights/best_model_weights.h5"

    # PyTorch fallback weights
    model_weights: "weights/fer_mini_xception.pt"
    clcm_weights: "weights/fer_clcm.pt"

    # Face detection backend: "mediapipe" | "haar"
    face_detector: "haar"
    min_face_confidence: 0.5
    face_padding_ratio: 0.15

    # Emotion contribution polarity
    positive_emotions: ["happy", "surprise"]
    negative_emotions: []

    # ── Binary Expert CNNs (Salman et al., 2025 -- MoEDE principle) ──────────
    expert_weights:
      disgust: "weights/expert_disgust.pt"
      fear:    "weights/expert_fear.pt"
    expert_trigger_threshold: 0.60

    # ── Temporal Aggregation (Salman et al., 2025 -- LSTM principle) ─────────
    temporal_window: 10
    lstm_weights: null

    # ── Intensity Ranking (Punuri et al., 2024 -- A3) ────────────────────────
    # Grad-CAM mean activation thresholds:
    # < minimal -> MINIMAL (weight=0.20), between -> AVERAGE (weight=1.00), >= strong -> STRONG (weight=1.50)
    intensity_thresholds:
      minimal: 0.30
      strong:  0.60

    # ── Grad-CAM Heatmap Visualizer ──────────────────────────────────────────
    gradcam:
      save_enabled: true
      output_dir: "outputs/gradcam"
      max_saves_per_clip: 3
      target_size: [224, 224]
      overlay_alpha: 0.45

  # ── Phase 4: Stream C — Technical Quality & Motion ─────────────────────────
  quality:
    # Laplacian blur gate: clips below this value are zero-weighted
    blur_threshold: 100.0

# ── Phase 5: Saliency Fusion & Selection ─────────────────────────────────────
fusion:
  weights:
    w1: 0.40   # Stream B: Affective / Emotion score
    w2: 0.35   # Stream A: Semantic / Object detection score
    w3: 0.25   # Stream C: Motion energy score

selection:
  # Target duration (seconds) of the output highlight reel
  target_duration_sec: 60.0
  # Discretization bin size (seconds) for 0/1 Knapsack DP table
  bin_size_sec: 0.1

# ── Phase 6: Assembly & Rendering ────────────────────────────────────────────
rendering:
  audio_path: null
  slowmo_threshold: 0.85
  slowmo_factor: 0.5
  output_path: "outputs/highlight.mp4"
  codec: "libx264"
  audio_codec: "aac"
  fps: null

# ── Dataset Directories ──────────────────────────────────────────────────────
datasets:
  fer_dataset_root: "data/DATASET"
  sample_video: "data/sample_test_video.mp4"
